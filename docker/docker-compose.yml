name: control_easy
services:
  reverse-proxy:
    image: traefik:v3.1
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Listen on the published HTTPS port so redirect Location headers are
      # reachable from the browser (e.g. https://localhost:8443/...).
      - --entrypoints.websecure.address=:${REVERSE_PROXY_HTTPS_PORT:-8443}
      # Required in Traefik v3: without entrypoint-level TLS the HTTP router
      # layer on websecure stays disabled and every request 404s.
      - --entrypoints.websecure.http.tls=true
      - --api.insecure=true
    ports:
      # Bound to loopback for dev: the stack is meant to be reached via
      # localhost / *.localhost only. Change for hosted deployments.
      - "127.0.0.1:${REVERSE_PROXY_PORT:-8080}:80"
      - "127.0.0.1:${REVERSE_PROXY_HTTPS_PORT:-8443}:${REVERSE_PROXY_HTTPS_PORT:-8443}"
      - "${REVERSE_PROXY_API_PORT:-8082}:8080"
    volumes:
      - ./reverse-proxy/traefik.yml:/etc/traefik/static.yml:ro
      - ./reverse-proxy/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - ./reverse-proxy/certs:/etc/traefik/certs:ro
      - traefik-data:/letsencrypt

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      Db__Provider: MySQL
      Db__Host: db
      Db__Port: "3306"
      Db__Database: controleasydb
      Db__Username: ${MYSQL_USER:-controleasy}
      Db__Password: ${MYSQL_PASSWORD:-controleasy_dev}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-CHANGE-ME-IN-PRODUCTION-AT-LEAST-32-CHARS!}
      Jwt__Issuer: ControlEasyReborn
      Jwt__Audience: ControlEasyReborn
      ASPNETCORE_ENVIRONMENT: Development
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
      Storage__Provider: Local
      Storage__Local__Path: /storage/photos
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8081}:8080"
    volumes:
      - photos-data:/storage/photos
    labels:
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    labels:
      - "traefik.http.services.web.loadbalancer.server.port=8080"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-controleasy_root_dev}
      MYSQL_DATABASE: controleasydb
      MYSQL_USER: ${MYSQL_USER:-controleasy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-controleasy_dev}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" && mysql --protocol=tcp -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e \"USE $$MYSQL_DATABASE; SELECT IF((SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE()) > 0, 1, 0)\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  db-migrate:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: controleasydb
      MYSQL_USER: ${MYSQL_USER:-controleasy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-controleasy_dev}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./mysql/migrations:/migrations:ro
    command:
      - /bin/sh
      - -ec
      - mysql --protocol=tcp -h db -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" < /migrations/10-photo-entity-bindings.sql && mysql --protocol=tcp -h db -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" < /migrations/0009-access-control.sql && mysql --protocol=tcp -h db -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" < /migrations/0010-backfill-tenant-admin-permissions.sql

  adminer:
    image: adminer:4
    labels:
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq-data:/data

volumes:
  mysql-data:
  traefik-data:
  seq-data:
  photos-data:
