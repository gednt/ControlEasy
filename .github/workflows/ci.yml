name: ci

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true
  WEB_DIR: src/Web/ControlEasyReborn.Web
  COMPOSE_PROJECT_NAME: ce-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ${{ env.WEB_DIR }}/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
      - run: dotnet restore src/ControlEasyReborn.sln
      - name: Detect C# changes
        id: cs
        # Skip the (relatively expensive) `dotnet format` step when the
        # PR touches only Web/.ts files. The format check is still
        # enforced by `scripts/verify-ci-local.sh` (Stage 1) for local
        # agents. C# formatting on push-to-main is also covered by
        # developers running that script before pushing.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            git fetch --depth=1 origin "$BASE" 2>/dev/null || git fetch --depth=1 origin "$BASE:$BASE" || true
          else
            BASE="HEAD~1"
          fi
          if git diff --name-only "$BASE"...HEAD 2>/dev/null | grep -qE '\.cs$'; then
            echo "has_cs_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cs_changes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check C# format
        if: steps.cs.outputs.has_cs_changes == 'true'
        run: dotnet format src/ControlEasyReborn.sln --verify-no-changes --no-restore
      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.WEB_DIR }}
      - run: npm run lint
        working-directory: ${{ env.WEB_DIR }}
      - name: Setup Headless Chrome
        run: |
          npx playwright install --with-deps chromium
          CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "Set CHROME_BIN to $CHROME_PATH"
        working-directory: ${{ env.WEB_DIR }}
      - run: npm test -- --no-watch --browsers=ChromeHeadlessNoSandbox
        working-directory: ${{ env.WEB_DIR }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ${{ env.WEB_DIR }}/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
      - run: dotnet build src/ControlEasyReborn.sln
      - name: tokens-contract
        run: dotnet test tests/ControlEasyReborn.ArchitectureTests --filter TokensContract --no-build
      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.WEB_DIR }}
      - run: npm run ng -- build --configuration production
        working-directory: ${{ env.WEB_DIR }}

  test-fast:
    name: test (unit + architecture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-
      - run: dotnet test tests/ControlEasyReborn.UnitTests --logger "console;verbosity=minimal"
      - run: dotnet test tests/ControlEasyReborn.ArchitectureTests --logger "console;verbosity=minimal" --filter "FullyQualifiedName!~TokensContract"

  test-integration:
    name: test (integration — Testcontainers MySQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Cache Docker MySQL image
        uses: actions/cache@v4
        with:
          path: /tmp/mysql-image.tar
          key: docker-mysql-8.0
      - name: Load cached MySQL image
        run: docker load -i /tmp/mysql-image.tar 2>/dev/null || true
      - run: dotnet test tests/ControlEasyReborn.IntegrationTests --logger "console;verbosity=minimal"
      - name: Save MySQL image for cache
        if: always()
        run: docker image inspect mysql:8.0 >/dev/null 2>&1 && docker save mysql:8.0 -o /tmp/mysql-image.tar || true

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ${{ env.WEB_DIR }}/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
      - name: Build API
        run: dotnet build src/ControlEasyReborn.sln --configuration Release
      - name: Generate swagger.json via in-process API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Bootstrap__Enabled: "false"
          Db__Provider: MySQL
          Db__Host: 127.0.0.1
          Db__Port: "3306"
          Db__Database: controleasydb
          Db__Username: dummy
          Db__Password: dummy
          Jwt__SigningKey: CI-DUMMY-KEY-FOR-SWAGGER-GEN-ONLY-32-CHARS!!
          Jwt__Issuer: ControlEasyReborn
          Jwt__Audience: ControlEasyReborn
        run: |
          set -euo pipefail
          SWAGGER_PATH="$GITHUB_WORKSPACE/swagger.json"
          dotnet run --project src/Host/ControlEasyReborn.Api --configuration Release --no-build -- \
            --urls "http://127.0.0.1:18099" &
          API_PID=$!
          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            STATUS=$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w "%{http_code}" "http://127.0.0.1:18099/swagger/v1/swagger.json" || true)
            if [[ "$STATUS" == "200" ]]; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error "http://127.0.0.1:18099/swagger/v1/swagger.json" -o "$SWAGGER_PATH"
          kill $API_PID 2>/dev/null || true
          wait $API_PID 2>/dev/null || true
          echo "swagger.json saved at $SWAGGER_PATH ($(wc -c < "$SWAGGER_PATH") bytes)"
          echo "SWAGGER_PATH=$SWAGGER_PATH" >> "$GITHUB_ENV"
      - name: Setup ng-openapi-gen
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.WEB_DIR }}
      - name: Run OpenAPI drift check
        run: |
          npx ng-openapi-gen --input "$SWAGGER_PATH" --config ng-openapi-gen.json
          git diff --exit-code -- src/app/api
        working-directory: ${{ env.WEB_DIR }}

  docker:
    if: false
    needs: [build, test-fast, test-integration, openapi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/controleasy-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/controleasy-web:${{ github.sha }}